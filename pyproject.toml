[project]
name = "GenesisPy"
version = "0.0.1"
authors = [
  { name="Matthew S. Gillman" },
]
description = "Python implementation of GENESIS."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/mattagape/GenesisPy"
Issues = "https://github.com/mattagape/GenesisPy/issues"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"